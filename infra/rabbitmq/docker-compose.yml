services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hsp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: hsp
      RABBITMQ_DEFAULT_PASS: hsp-local-drill-20260801
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro

volumes:
  rabbitmq-data:
