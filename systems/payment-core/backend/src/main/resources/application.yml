server:
  port: 8080

spring:
  application:
    name: home-service-payment-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${HSP_DB_URL:jdbc:mysql://127.0.0.1:3306/housekeeping_payment_core?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${HSP_DB_USERNAME:root}
    password: ${HSP_DB_PASSWORD:}
  rabbitmq:
    host: ${HSP_RABBITMQ_HOST:127.0.0.1}
    port: ${HSP_RABBITMQ_PORT:5672}
    username: ${HSP_RABBITMQ_USERNAME:hsp}
    password: ${HSP_RABBITMQ_PASSWORD:}
    virtual-host: ${HSP_RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  sql:
    init:
      # 外部 MySQL 的支付事实不能随应用重启被 schema.sql/data.sql 覆盖。
      mode: ${HSP_SQL_INIT_MODE:never}
      encoding: UTF-8

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

payment:
  callback:
    # 模拟环境关闭，真实渠道接入环境必须打开并注入独立密钥。
    require-signature: ${HSP_PAYMENT_CALLBACK_REQUIRE_SIGNATURE:false}
    secret: ${HSP_PAYMENT_CALLBACK_SECRET:}
    allowed-skew-seconds: ${HSP_PAYMENT_CALLBACK_ALLOWED_SKEW_SECONDS:300}
    nonce-ttl-seconds: ${HSP_PAYMENT_CALLBACK_NONCE_TTL_SECONDS:600}
  expiry-close:
    fixed-delay-ms: ${HSP_PAYMENT_EXPIRY_CLOSE_DELAY_MS:60000}
  event-retry:
    fixed-delay-ms: ${HSP_PAYMENT_EVENT_RETRY_DELAY_MS:300000}
  refund-retry:
    fixed-delay-ms: ${HSP_PAYMENT_REFUND_RETRY_DELAY_MS:300000}
  downstream:
    clearing:
      payment-success-url: ${HSP_PAYMENT_DOWNSTREAM_CLEARING_PAYMENT_SUCCESS_URL:http://127.0.0.1:18120/api/clearing/events/payments/success}
    accounting:
      payment-success-url: ${HSP_PAYMENT_DOWNSTREAM_ACCOUNTING_PAYMENT_SUCCESS_URL:http://127.0.0.1:18110/api/accounting/events/payments/success}
      payment-success-account-no: ${HSP_PAYMENT_DOWNSTREAM_ACCOUNTING_PAYMENT_SUCCESS_ACCOUNT_NO:ACT10003}
  event-dispatch:
    # http keeps existing environments stable; test/pre switch to amqp after the broker is ready.
    mode: ${HSP_PAYMENT_EVENT_DISPATCH_MODE:http}
  risk-control:
    enabled: ${HSP_PAYMENT_RISK_CONTROL_ENABLED:false}
    evaluate-url: ${HSP_PAYMENT_RISK_CONTROL_EVALUATE_URL:http://127.0.0.1:18160/api/risk-control/decisions/evaluate}
    timeout-ms: ${HSP_PAYMENT_RISK_CONTROL_TIMEOUT_MS:2000}
  ops-config:
    enabled: ${HSP_PAYMENT_OPS_CONFIG_ENABLED:false}
    snapshot-url: ${HSP_PAYMENT_OPS_CONFIG_SNAPSHOT_URL:http://127.0.0.1:18170/api/ops-config/effective-snapshot}
    timeout-ms: ${HSP_PAYMENT_OPS_CONFIG_TIMEOUT_MS:2000}
  amqp:
    payment-success-exchange: ${HSP_PAYMENT_AMQP_PAYMENT_SUCCESS_EXCHANGE:payment.trade}
    payment-success-routing-key: ${HSP_PAYMENT_AMQP_PAYMENT_SUCCESS_ROUTING_KEY:payment.success.v1}
    publisher-confirm-timeout-ms: ${HSP_PAYMENT_AMQP_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}
    dead-letter-task-enabled: ${HSP_PAYMENT_AMQP_DEAD_LETTER_TASK_ENABLED:false}
    dead-letter-task-queue: ${HSP_PAYMENT_AMQP_DEAD_LETTER_TASK_QUEUE:payment.compensation.dlq-intake}
  issue-alert:
    im:
      # 配置后 IM 告警会优先投递到外部 Webhook；为空时使用本地回执兜底，便于本地开发和自动化测试。
      webhook-url: ${HSP_PAYMENT_ISSUE_ALERT_IM_WEBHOOK_URL:}
      timeout-ms: ${HSP_PAYMENT_ISSUE_ALERT_IM_TIMEOUT_MS:3000}
      success-code-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_IM_SUCCESS_CODE_JSON_POINTER:}
      success-code-expected-value: ${HSP_PAYMENT_ISSUE_ALERT_IM_SUCCESS_CODE_EXPECTED_VALUE:}
      receipt-no-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_IM_RECEIPT_NO_JSON_POINTER:}
      auth-header-name: ${HSP_PAYMENT_ISSUE_ALERT_IM_AUTH_HEADER_NAME:}
      auth-header-value: ${HSP_PAYMENT_ISSUE_ALERT_IM_AUTH_HEADER_VALUE:}
      signature-header-name: ${HSP_PAYMENT_ISSUE_ALERT_IM_SIGNATURE_HEADER_NAME:}
      signature-secret: ${HSP_PAYMENT_ISSUE_ALERT_IM_SIGNATURE_SECRET:}
      signature-algorithm: ${HSP_PAYMENT_ISSUE_ALERT_IM_SIGNATURE_ALGORITHM:HMAC_SHA256}
      timestamp-header-name: ${HSP_PAYMENT_ISSUE_ALERT_IM_TIMESTAMP_HEADER_NAME:}
      nonce-header-name: ${HSP_PAYMENT_ISSUE_ALERT_IM_NONCE_HEADER_NAME:}
      delivery-status-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_IM_DELIVERY_STATUS_JSON_POINTER:}
      delivered-status-values: ${HSP_PAYMENT_ISSUE_ALERT_IM_DELIVERED_STATUS_VALUES:}
      accepted-status-values: ${HSP_PAYMENT_ISSUE_ALERT_IM_ACCEPTED_STATUS_VALUES:}
      failed-status-values: ${HSP_PAYMENT_ISSUE_ALERT_IM_FAILED_STATUS_VALUES:}
      failure-code-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_IM_FAILURE_CODE_JSON_POINTER:}
    sms:
      # 配置后短信告警会优先投递到外部 HTTP 网关；为空时使用本地回执兜底。
      webhook-url: ${HSP_PAYMENT_ISSUE_ALERT_SMS_WEBHOOK_URL:}
      timeout-ms: ${HSP_PAYMENT_ISSUE_ALERT_SMS_TIMEOUT_MS:3000}
      success-code-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_SMS_SUCCESS_CODE_JSON_POINTER:}
      success-code-expected-value: ${HSP_PAYMENT_ISSUE_ALERT_SMS_SUCCESS_CODE_EXPECTED_VALUE:}
      receipt-no-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_SMS_RECEIPT_NO_JSON_POINTER:}
      auth-header-name: ${HSP_PAYMENT_ISSUE_ALERT_SMS_AUTH_HEADER_NAME:}
      auth-header-value: ${HSP_PAYMENT_ISSUE_ALERT_SMS_AUTH_HEADER_VALUE:}
      signature-header-name: ${HSP_PAYMENT_ISSUE_ALERT_SMS_SIGNATURE_HEADER_NAME:}
      signature-secret: ${HSP_PAYMENT_ISSUE_ALERT_SMS_SIGNATURE_SECRET:}
      signature-algorithm: ${HSP_PAYMENT_ISSUE_ALERT_SMS_SIGNATURE_ALGORITHM:HMAC_SHA256}
      timestamp-header-name: ${HSP_PAYMENT_ISSUE_ALERT_SMS_TIMESTAMP_HEADER_NAME:}
      nonce-header-name: ${HSP_PAYMENT_ISSUE_ALERT_SMS_NONCE_HEADER_NAME:}
      delivery-status-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_SMS_DELIVERY_STATUS_JSON_POINTER:}
      delivered-status-values: ${HSP_PAYMENT_ISSUE_ALERT_SMS_DELIVERED_STATUS_VALUES:}
      accepted-status-values: ${HSP_PAYMENT_ISSUE_ALERT_SMS_ACCEPTED_STATUS_VALUES:}
      failed-status-values: ${HSP_PAYMENT_ISSUE_ALERT_SMS_FAILED_STATUS_VALUES:}
      failure-code-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_SMS_FAILURE_CODE_JSON_POINTER:}
    email:
      # 配置后邮件告警会优先投递到外部 HTTP 网关；为空时使用本地回执兜底。
      webhook-url: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_WEBHOOK_URL:}
      timeout-ms: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_TIMEOUT_MS:3000}
      success-code-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_SUCCESS_CODE_JSON_POINTER:}
      success-code-expected-value: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_SUCCESS_CODE_EXPECTED_VALUE:}
      receipt-no-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_RECEIPT_NO_JSON_POINTER:}
      auth-header-name: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_AUTH_HEADER_NAME:}
      auth-header-value: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_AUTH_HEADER_VALUE:}
      signature-header-name: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_SIGNATURE_HEADER_NAME:}
      signature-secret: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_SIGNATURE_SECRET:}
      signature-algorithm: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_SIGNATURE_ALGORITHM:HMAC_SHA256}
      timestamp-header-name: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_TIMESTAMP_HEADER_NAME:}
      nonce-header-name: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_NONCE_HEADER_NAME:}
      delivery-status-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_DELIVERY_STATUS_JSON_POINTER:}
      delivered-status-values: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_DELIVERED_STATUS_VALUES:}
      accepted-status-values: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_ACCEPTED_STATUS_VALUES:}
      failed-status-values: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_FAILED_STATUS_VALUES:}
      failure-code-json-pointer: ${HSP_PAYMENT_ISSUE_ALERT_EMAIL_FAILURE_CODE_JSON_POINTER:}
