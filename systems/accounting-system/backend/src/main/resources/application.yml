server:
  port: 18110

spring:
  application:
    name: home-service-accounting-backend
  datasource:
    url: jdbc:h2:mem:accounting_system;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  rabbitmq:
    host: ${HSP_RABBITMQ_HOST:127.0.0.1}
    port: ${HSP_RABBITMQ_PORT:5672}
    username: ${HSP_RABBITMQ_USERNAME:hsp}
    password: ${HSP_RABBITMQ_PASSWORD:}
    virtual-host: ${HSP_RABBITMQ_VHOST:/}
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

accounting:
  amqp:
    enabled: ${HSP_ACCOUNTING_AMQP_ENABLED:false}
    payment-success-queue: ${HSP_ACCOUNTING_AMQP_PAYMENT_SUCCESS_QUEUE:accounting.payment-success}
    clearing-generated-queue: ${HSP_ACCOUNTING_AMQP_CLEARING_GENERATED_QUEUE:accounting.clearing-generated}
    retry-exchange: ${HSP_ACCOUNTING_AMQP_RETRY_EXCHANGE:payment.trade.retry}
    retry-routing-key: ${HSP_ACCOUNTING_AMQP_RETRY_ROUTING_KEY:payment.success.accounting.retry.v1}
    dead-letter-exchange: ${HSP_ACCOUNTING_AMQP_DEAD_LETTER_EXCHANGE:payment.trade.dlq}
    dead-letter-routing-key: ${HSP_ACCOUNTING_AMQP_DEAD_LETTER_ROUTING_KEY:payment.success.accounting.dlq.v1}
    clearing-generated-retry-exchange: ${HSP_ACCOUNTING_AMQP_CLEARING_GENERATED_RETRY_EXCHANGE:clearing.trade.retry}
    clearing-generated-retry-routing-key: ${HSP_ACCOUNTING_AMQP_CLEARING_GENERATED_RETRY_ROUTING_KEY:clearing.generated.accounting.retry.v1}
    clearing-generated-dead-letter-exchange: ${HSP_ACCOUNTING_AMQP_CLEARING_GENERATED_DEAD_LETTER_EXCHANGE:clearing.trade.dlq}
    clearing-generated-dead-letter-routing-key: ${HSP_ACCOUNTING_AMQP_CLEARING_GENERATED_DEAD_LETTER_ROUTING_KEY:clearing.generated.accounting.dlq.v1}
    max-retry-count: ${HSP_ACCOUNTING_AMQP_MAX_RETRY_COUNT:3}
