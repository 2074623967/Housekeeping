server:
  port: 8090

spring:
  application:
    name: home-service-gateway-access-backend
  datasource:
    url: jdbc:h2:mem:gateway_access;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

gateway:
  transaction:
    app-code: ${HSP_GATEWAY_PAYMENT_APP_CODE:APP_PAY_CORE}
    permission-code: ${HSP_GATEWAY_PAYMENT_PERMISSION_CODE:PERM_PAYMENT_CORE}
    # 默认留空，部署时必须显式注入；未配置时交易接口失败闭合。
    access-key: ${HSP_GATEWAY_PAYMENT_ACCESS_KEY:}
    environment: ${HSP_GATEWAY_PAYMENT_ENVIRONMENT:PROD}
    timeout-ms: ${HSP_GATEWAY_PAYMENT_QUERY_TIMEOUT_MS:2000}
    channels:
      wx_h5:
        gateway-code: GW_WX
        payment-submit-url: ${HSP_GATEWAY_WX_PAYMENT_SUBMIT_URL:}
        payment-query-url: ${HSP_GATEWAY_WX_PAYMENT_QUERY_URL:}
      alipay_h5:
        gateway-code: GW_ALI
        payment-submit-url: ${HSP_GATEWAY_ALIPAY_PAYMENT_SUBMIT_URL:}
        payment-query-url: ${HSP_GATEWAY_ALIPAY_PAYMENT_QUERY_URL:}
      offline_bank:
        gateway-code: GW_BANK
        payment-submit-url: ${HSP_GATEWAY_BANK_PAYMENT_SUBMIT_URL:}
        payment-query-url: ${HSP_GATEWAY_BANK_PAYMENT_QUERY_URL:}
