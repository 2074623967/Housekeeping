server:
  port: 18120

spring:
  application:
    name: home-service-clearing-backend
  datasource:
    url: jdbc:h2:mem:clearing_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  rabbitmq:
    host: ${HSP_RABBITMQ_HOST:127.0.0.1}
    port: ${HSP_RABBITMQ_PORT:5672}
    username: ${HSP_RABBITMQ_USERNAME:hsp}
    password: ${HSP_RABBITMQ_PASSWORD:}
    virtual-host: ${HSP_RABBITMQ_VHOST:/}
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

clearing:
  downstream:
    accounting:
      clearing-generated-account-no: ${HSP_CLEARING_DOWNSTREAM_ACCOUNTING_CLEARING_GENERATED_ACCOUNT_NO:ACT10002}
  amqp:
    enabled: ${HSP_CLEARING_AMQP_ENABLED:false}
    dispatch-mode: ${HSP_CLEARING_AMQP_DISPATCH_MODE:http}
    clearing-generated-exchange: ${HSP_CLEARING_AMQP_CLEARING_GENERATED_EXCHANGE:clearing.trade}
    clearing-generated-routing-key: ${HSP_CLEARING_AMQP_CLEARING_GENERATED_ROUTING_KEY:clearing.generated.v1}
    publisher-confirm-timeout-ms: ${HSP_CLEARING_AMQP_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}
    payment-success-queue: ${HSP_CLEARING_AMQP_PAYMENT_SUCCESS_QUEUE:clearing.payment-success}
    retry-exchange: ${HSP_CLEARING_AMQP_RETRY_EXCHANGE:payment.trade.retry}
    retry-routing-key: ${HSP_CLEARING_AMQP_RETRY_ROUTING_KEY:payment.success.retry.v1}
    dead-letter-exchange: ${HSP_CLEARING_AMQP_DEAD_LETTER_EXCHANGE:payment.trade.dlq}
    dead-letter-routing-key: ${HSP_CLEARING_AMQP_DEAD_LETTER_ROUTING_KEY:payment.success.dlq.v1}
    max-retry-count: ${HSP_CLEARING_AMQP_MAX_RETRY_COUNT:3}
