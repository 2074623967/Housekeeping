server:
  port: ${RECONCILIATION_CENTER_PORT:18150}

spring:
  application:
    name: home-service-reconciliation-backend
  datasource:
    url: ${RECONCILIATION_DATASOURCE_URL:jdbc:h2:mem:reconciliation;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${RECONCILIATION_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${RECONCILIATION_DATASOURCE_USERNAME:sa}
    password: ${RECONCILIATION_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: ${RECONCILIATION_SQL_INIT_MODE:always}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

