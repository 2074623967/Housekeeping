server:
  port: ${RISK_CONTROL_PORT:18180}
spring:
  application:
    name: home-service-risk-control-backend
  datasource:
    url: ${RISK_CONTROL_DATASOURCE_URL:jdbc:h2:mem:risk_control;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${RISK_CONTROL_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${RISK_CONTROL_DATASOURCE_USERNAME:sa}
    password: ${RISK_CONTROL_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: ${RISK_CONTROL_SQL_INIT_MODE:always}
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
risk-control:
  ops-config:
    enabled: ${RISK_CONTROL_OPS_CONFIG_ENABLED:false}
    snapshot-url: ${RISK_CONTROL_OPS_CONFIG_SNAPSHOT_URL:http://127.0.0.1:18170/api/ops-config/effective-snapshot}
    timeout-ms: ${RISK_CONTROL_OPS_CONFIG_TIMEOUT_MS:2000}
