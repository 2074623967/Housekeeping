server:
  port: 18130

spring:
  application:
    name: home-service-settlement-backend
  datasource:
    url: jdbc:h2:mem:settlement_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  rabbitmq:
    host: ${HSP_RABBITMQ_HOST:localhost}
    port: ${HSP_RABBITMQ_PORT:5672}
    username: ${HSP_RABBITMQ_USERNAME:hsp}
    password: ${HSP_RABBITMQ_PASSWORD:}
    virtual-host: ${HSP_RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

settlement:
  payout-inspection:
    enabled: ${HSP_SETTLEMENT_PAYOUT_INSPECTION_ENABLED:false}
    fixed-delay-ms: ${HSP_SETTLEMENT_PAYOUT_INSPECTION_FIXED_DELAY_MS:300000}
  downstream:
    reconciliation:
      fact-url: ${HSP_SETTLEMENT_DOWNSTREAM_RECONCILIATION_FACT_URL:}
  amqp:
    enabled: ${HSP_SETTLEMENT_AMQP_ENABLED:false}
    clearing-generated-queue: ${HSP_SETTLEMENT_AMQP_CLEARING_GENERATED_QUEUE:settlement.clearing-generated}
    retry-exchange: ${HSP_SETTLEMENT_AMQP_RETRY_EXCHANGE:clearing.trade.retry}
    retry-routing-key: ${HSP_SETTLEMENT_AMQP_RETRY_ROUTING_KEY:clearing.generated.settlement.retry.v1}
    dead-letter-exchange: ${HSP_SETTLEMENT_AMQP_DEAD_LETTER_EXCHANGE:clearing.trade.dlq}
    dead-letter-routing-key: ${HSP_SETTLEMENT_AMQP_DEAD_LETTER_ROUTING_KEY:clearing.generated.settlement.dlq.v1}
    max-retry-count: ${HSP_SETTLEMENT_AMQP_MAX_RETRY_COUNT:3}
    forward-confirm-timeout-ms: ${HSP_SETTLEMENT_AMQP_FORWARD_CONFIRM_TIMEOUT_MS:5000}
